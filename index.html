
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gold Finder</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#10141d;color:white;
 font-family:Arial,sans-serif;padding:20px;
}
h2{color:#e8b64d;margin-top:0}
.card{
 background:#1b2432;padding:17px;
 border-radius:15px;margin-bottom:16px;
}
.label{color:#9eacbd;font-size:13px}
input,select{
 width:100%;padding:13px;margin-top:8px;
 background:#26374a;color:white;
 border:1px solid #405064;border-radius:9px;
 font-size:16px;
}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{
 width:100%;padding:15px;border:0;
 border-radius:10px;font-size:15px;
 font-weight:bold;margin-top:10px;
}
.start{background:#d5a63f;color:#171717}
.stop{background:#344256;color:white}
.status{font-size:23px;font-weight:bold;margin-top:8px}
</style>
</head>
<body>

<h2>🎯 GOLD FINDER</h2>

<div class="card">
 <div class="label">СТАТУС МОНИТОРИНГА</div>
 <div class="status" id="status">Остановлен</div>
 <div class="label">Проверка каждые 15 секунд</div>
</div>

<div class="card">
 <b>💰 Цена СБП за 1 Gold</b>
 <div class="grid">
  <div>
   <div class="label">От, ₽</div>
   <input id="minPrice" type="number" value="0.10" step="0.01">
  </div>
  <div>
   <div class="label">До, ₽</div>
   <input id="maxPrice" type="number" value="0.50" step="0.01">
  </div>
 </div>
</div>

<div class="card">
 <b>📦 Количество Gold</b>
 <div class="grid">
  <div>
   <div class="label">От</div>
   <input id="minAmount" type="number" value="10">
  </div>
  <div>
   <div class="label">До</div>
   <input id="maxAmount" type="number" value="10000">
  </div>
 </div>
</div>

<div class="card">
 <b>⏱ Длительность</b>
 <select id="duration">
  <option value="300">5 минут</option>
  <option value="900">15 минут</option>
  <option value="1800">30 минут</option>
  <option value="3600">1 час</option>
  <option value="7200">2 часа</option>
  <option value="21600">6 часов</option>
 </select>
</div>

<button class="start" onclick="startMonitor()">
🚀 ЗАПУСТИТЬ МОНИТОРИНГ
</button>

<button class="stop" onclick="stopMonitor()">
⛔ ОСТАНОВИТЬ
</button>

<div class="card" style="margin-top:18px">
 <b>🪙 Найденные объявления</b>
 <div id="offers" class="label" style="margin-top:12px">
  Пока объявлений нет
 </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

function startMonitor(){
 const settings={
  min_price:Number(document.getElementById("minPrice").value),
  max_price:Number(document.getElementById("maxPrice").value),
  min_amount:Number(document.getElementById("minAmount").value),
  max_amount:Number(document.getElementById("maxAmount").value),
  duration:Number(document.getElementById("duration").value)
 };

 if(settings.min_price<=0 ||
    settings.max_price<settings.min_price ||
    settings.min_amount<1 ||
    settings.max_amount<settings.min_amount){
  tg.showAlert("Проверь настройки фильтров");
  return;
 }

 tg.sendData(JSON.stringify({
  action:"start",
  settings:settings
 }));
}

function stopMonitor(){
 tg.sendData(JSON.stringify({action:"stop"}));
}
</script>

</body>
</html>
